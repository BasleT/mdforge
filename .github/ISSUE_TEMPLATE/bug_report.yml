name: Bug Report
description: Report a reproducible mdforge problem.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve mdforge. Please avoid including private source material in public issues.
  - type: input
    id: version
    attributes:
      label: mdforge version
      placeholder: "mdforge 0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS, Ubuntu, etc."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Ollama model
      placeholder: "qwen2.5-coder:14b"
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, with private paths or content removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
